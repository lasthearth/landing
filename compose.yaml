services:
    # Сайт целиком: Node-сервер SSR на 8080 отдаёт статику и страницы.
    # Один контейнер и тот же внешний порт 4200, что до перехода на SSR.
    web:
        build:
            context: .
            target: app
        environment:
            NODE_ENV: production
            PORT: 8080
        ports:
            - "4200:8080"
        restart: unless-stopped
