<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <title>Last Hearth — ролевой сервер Vintage Story</title>
        <base href="/" />

        <!--
            Предотвращает промаргивание темы при перезагрузке.
            Выставляет data-theme до загрузки Angular: сохранённый выбор, иначе системная тема.
        -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('lh-theme');
                    if (theme) {
                        theme = JSON.parse(theme);
                    }
                    // Без сохранённого выбора тема следует системной настройке.
                    if (theme !== 'dark' && theme !== 'light') {
                        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    }
                    if (theme === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                } catch (e) {
                    // localStorage недоступен или значение повреждено — оставляем светлую тему
                }
            })();
        </script>

        <!--
            Есть ли сохранённая сессия входа (angular-auth-oidc-client хранит её в localStorage
            под ключом конфигурации, с полем authzData). Пререндер главной — гостевой,
            а признак входа приходит только после проверки токена и загрузки профиля:
            без этого флага вошедший игрок секунду видел гостевую карусель.
        -->
        <script>
            (function () {
                try {
                    for (var i = 0; i < localStorage.length; i++) {
                        var raw = localStorage.getItem(localStorage.key(i));
                        if (raw && raw.indexOf('authzData') !== -1) {
                            var data = JSON.parse(raw);
                            if (data && data.authzData) {
                                document.documentElement.classList.add('lh-has-session');
                                break;
                            }
                        }
                    }
                } catch (e) {
                    // localStorage недоступен — считаем гостем
                }
            })();
        </script>

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Last Hearth — уникальный ролевой политико-экономический сервер Vintage Story. Развивайте поселения, ведите войны, заключайте союзы и участвуйте в жизни Империи."
        />
        <meta name="theme-color" content="#332c26" />
        <!--
            Подтверждение прав владельца: значения выдаёт Яндекс.Вебмастер и Google Search
            Console, их проставляет владелец (задача 010). Пока строки закомментированы,
            чтобы в выдачу не ушёл placeholder.
        -->
        <!-- <meta name="yandex-verification" content="ЗАМЕНИТЬ" /> -->
        <!-- <meta name="google-site-verification" content="ЗАМЕНИТЬ" /> -->

        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <link
            rel="alternate"
            type="application/rss+xml"
            title="Last Hearth — новости"
            href="/rss.xml"
        />

        <link rel="preconnect" href="https://api.lasthearth.ru" crossorigin />

        <!--
            Шрифты раздаются со своего домена (@fontsource, см. @import в src/styles.css):
            Google Fonts из России открывается нестабильно, а его CSS блокирует первый рендер.
            preload — только основное начертание кириллицы; остальное подтягивается по unicode-range.
        -->
        <link
            rel="preload"
            href="/media/advent-pro-cyrillic-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <!--
            Schema.org: один граф на весь сайт. SearchAction здесь нет — поиска
            по сайту не существует, а обещать роботу несуществующее нельзя.
            Страницы дописывают свои узлы (Article, NewsArticle, BreadcrumbList)
            через SeoService.setJsonLd.
        -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "Organization",
                        "@id": "https://lasthearth.ru/#org",
                        "name": "Last Hearth",
                        "alternateName": "Последний очаг",
                        "url": "https://lasthearth.ru/",
                        "logo": {
                            "@type": "ImageObject",
                            "url": "https://lasthearth.ru/icon-512.png",
                            "width": 512,
                            "height": 512
                        },
                        "sameAs": [
                            "https://discord.com/invite/FZb7SGrSFy",
                            "https://www.youtube.com/@LISOVCORP",
                            "https://boosty.to/lisov",
                            "https://docs.lasthearth.ru/"
                        ]
                    },
                    {
                        "@type": "WebSite",
                        "@id": "https://lasthearth.ru/#website",
                        "name": "Last Hearth",
                        "url": "https://lasthearth.ru/",
                        "inLanguage": "ru",
                        "publisher": { "@id": "https://lasthearth.ru/#org" }
                    },
                    {
                        "@type": "GameServer",
                        "@id": "https://lasthearth.ru/#server",
                        "name": "Last Hearth",
                        "url": "https://lasthearth.ru/",
                        "description": "Ролевой политико-экономический сервер Vintage Story с поселениями, осадами, дипломатией и PvP.",
                        "game": {
                            "@type": "VideoGame",
                            "name": "Vintage Story",
                            "url": "https://www.vintagestory.at/"
                        },
                        "provider": { "@id": "https://lasthearth.ru/#org" }
                    }
                ]
            }
        </script>

    </head>
    <body>
        <app-root>
            <div class="app-splash" aria-label="Загрузка" role="status">
                <p class="app-splash__title">Last Hearth</p>
            </div>
        </app-root>

        <style>
            .app-splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.75rem;
                background: radial-gradient(circle at 50% 45%, #3f362d 0%, #2a231d 70%, #1e1915 100%);
                font-family: "Almendra", Georgia, "Times New Roman", serif;
            }

            .app-splash::after {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(ellipse at center, transparent 30%, rgba(15, 12, 10, 0.55) 75%, rgba(10, 8, 6, 0.85) 100%);
            }

            .app-splash__title {
                margin: 0;
                position: relative;
                z-index: 1;
                font-size: clamp(1.75rem, 6vw, 2.75rem);
                letter-spacing: 0.28em;
                text-indent: 0.28em;
                text-transform: uppercase;
                background: linear-gradient(
                    100deg,
                    #6b5c47 0%,
                    #6b5c47 35%,
                    #ffd483 50%,
                    #6b5c47 65%,
                    #6b5c47 100%
                );
                background-size: 200% 100%;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: app-splash-shimmer 3s linear infinite;
            }

            @keyframes app-splash-shimmer {
                0% {
                    background-position: 200% 0;
                }
                100% {
                    background-position: 0% 0;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .app-splash__title {
                    animation: none;
                    background: none;
                    -webkit-background-clip: initial;
                    background-clip: initial;
                    color: #e9d7b8;
                }
            }
        </style>
    </body>
</html>
