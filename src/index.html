        <!--
            Предотвращает промаргивание темы при перезагрузке.
            Выставляет data-theme до загрузки Angular, считывая сохранённое значение.
        -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('lh-theme');
                    if (theme) {
                        theme = JSON.parse(theme);
                    }
                    if (theme === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                } catch (e) {
                    // localStorage недоступен или значение повреждено — оставляем светлую тему
                }
            })();
        </script>

        <style>
            .app-splash {
                position: fixed;

                display: flex;

                );
                background-size: 200% 100%;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: app-splash-shimmer 3s linear infinite;
            }

            @keyframes app-splash-shimmer {

                }
            }

            @media (prefers-reduced-motion: reduce) {

                    background: none;
                    -webkit-background-clip: initial;
                    background-clip: initial;
                    color: #e9d7b8;
                }
            }
