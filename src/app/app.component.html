<a
    href="#main-content"
    class="fixed left-4 top-4 z-[300] -translate-y-[150%] rounded-lg bg-lh-accent px-4 py-2 text-white font-bold transition-transform focus:translate-y-0"
>
    Перейти к содержимому
</a>

<tui-root>
    <!-- Индикатор перехода: страницы вики открываются во весь экран ленивым
         чанком, и без него клик по ссылке выглядит как «ничего не произошло». -->
    <app-route-progress />

    <app-layout />

    <!--
        Согласие на аналитические cookies. Плашка отложена до простоя браузера:
        в пререндере её нет, иначе разметка разошлась бы с гидратацией у тех,
        кто уже ответил на вопрос.
    -->
    @defer (on idle) {
        <app-consent-banner />
    }
</tui-root>
