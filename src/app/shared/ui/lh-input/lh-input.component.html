<div
    [class.select-mode]="type() === 'select'"
    [class.has-icon]="icon() && type() !== 'select'"
    class="flexible-input"
>
    @if (type() === "input" || type() === "inputNumber") {
        <input
            type="text"
            [placeholder]="placeholder()"
            [value]="displayedValue"
            [disabled]="disabled"
            [attr.inputmode]="type() === 'inputNumber' ? 'numeric' : null"
            (input)="onInputChange($event)"
        />
    }

    @if (type() === "textarea") {
        <textarea
            [placeholder]="placeholder()"
            [value]="displayedValue"
            [disabled]="disabled"
            [rows]="rows()"
            (input)="onInputChange($event)"
        ></textarea>
    }

    @if (type() === "select") {
        <button
            type="button"
            class="select-trigger"
            role="combobox"
            aria-haspopup="listbox"
            [attr.aria-expanded]="dropdownOpen()"
            [attr.aria-label]="placeholder()"
            [disabled]="disabled"
            (click)="toggleDropdown()"
            (keydown.escape)="dropdownOpen.set(false)"
        >
            <span [class.text-ink-3]="!displayedValue" class="select-display">
                {{ displayedValue || placeholder() }}
            </span>
            <img
                src="/chevron-down.svg"
                alt=""
                [class.rotate-180]="dropdownOpen()"
                class="transition-all duration-300 opacity-50"
            />
        </button>
    }

    @if (icon() && type() !== "select") {
        <tui-icon [icon]="icon()" class="input-icon" />
    }

    @if (type() === "select") {
        <div [class.dropdown--open]="dropdownOpen()" class="dropdown" role="listbox">
            @for (item of items(); track $index) {
                <button
                    type="button"
                    role="option"
                    [attr.aria-selected]="item === value"
                    class="dropdown-option"
                    (click)="selectItem(item)"
                    (keydown.escape)="dropdownOpen.set(false)"
                >
                    {{ displayWith(item) }}
                </button>
            }
        </div>
    }
</div>
