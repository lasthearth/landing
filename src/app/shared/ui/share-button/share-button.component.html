<button
    type="button"
    class="share-button"
    [class.share-button--icon]="iconOnly()"
    [class.share-button--done]="copied()"
    [class.share-button--overlay]="appearance() === 'overlay'"
    [attr.aria-label]="labelKey() | translate"
    [attr.title]="labelKey() | translate"
    (click)="share($event)"
>
    <!-- Копирование/готово — кросс-фейд иконок (.lh-icon-swap из styles.css) -->
    <span class="lh-icon-swap">
        <tui-icon
            icon="@tui.share-2"
            class="lh-icon-swap__icon size-4!"
            [class.lh-icon-swap__icon--hidden]="copied()"
        />
        <tui-icon
            icon="@tui.check"
            class="lh-icon-swap__icon size-4!"
            [class.lh-icon-swap__icon--hidden]="!copied()"
        />
    </span>
    @if (!iconOnly()) {
        <span>{{ labelKey() | translate }}</span>
    }
</button>
