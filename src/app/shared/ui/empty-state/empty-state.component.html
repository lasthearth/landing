<div class="flex flex-col items-center justify-center gap-4 py-10 px-4 text-center">
    <div
        class="flex items-center justify-center size-16 rounded-2xl bg-lh-primary-2/10 border border-lh-primary-2/20 text-lh-primary/50"
    >
        <tui-icon [icon]="icon()" class="size-8!" />
    </div>
    <p class="text-xl md:text-2xl font-bold text-lh-primary">{{ title() | translate }}</p>
    @if (hasDescription()) {
        <p class="text-base md:text-lg text-ink-2 max-w-lg leading-relaxed">{{ description() | translate }}</p>
    }
</div>
