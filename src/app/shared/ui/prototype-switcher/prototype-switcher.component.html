@if (dev) {
    <nav class="proto-switcher" aria-label="Переключатель вариантов прототипа">
        <button type="button" class="proto-switcher__arrow" (click)="cycle(-1)" aria-label="Предыдущий вариант">
            ←
        </button>
        <span class="proto-switcher__label">
            {{ current() }} — {{ names()[current()] }}
        </span>
        <button type="button" class="proto-switcher__arrow" (click)="cycle(1)" aria-label="Следующий вариант">
            →
        </button>
    </nav>
}
