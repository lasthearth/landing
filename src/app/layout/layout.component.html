<app-background-scene />

@if (showWelcome$ | async) {
    <app-welcome
        [class.scroll]="isSetScrollClass"
        (onScroll)="onWelcomeScroll()"
        class="fixed inset-0 size-full welcome z-[200]"
    />
}

<div class="content-wrapper">
    <!-- Баннер объявления: узкая полоса над шапкой, пока есть действующее объявление -->
    <div class="flex justify-center">
        <app-site-announcement class="w-full xl:w-[min(72rem,85%)] layout-announcement" />
    </div>

    <div class="flex justify-center">
        <header class="w-full xl:w-[min(72rem,85%)]">
            <app-header />
        </header>
    </div>

    <main id="main-content">
        <router-outlet />
    </main>
</div>

<div class="flex justify-center">
    <footer class="w-full xl:w-[min(72rem,85%)] main-panel rounded-t-xl! rounded-b-none!">
        <app-footer />
    </footer>
</div>

<!--
    Игровой чат — плавающий виджет поверх контента: он не участвует
    в первом экране, поэтому его код и опрос Discord откладываются
    до простоя браузера.
-->
@defer (on idle) {
    <app-game-chat-widget
        [channelId]="environment.discordGameChatChannelId"
        [title]="'shared.gameChat.title' | translate"
        icon="@tui.message-square"
    />
}
