<app-background-particles></app-background-particles>

@if (showWelcome$ | async) {
    <app-welcome
        [class.scroll]="isSetScrollClass"
        (onScroll)="onWelcomeScroll()"
        class="fixed inset-0 size-full welcome z-[200]"
    />
}

<div class="content-wrapper">
    <div class="flex justify-center">
        <header class="w-full xl:w-[60%]">
            <app-header />
        </header>
    </div>

    <main id="main-content">
        <router-outlet />
    </main>
</div>

<div class="flex justify-center">
    <footer class="w-full xl:w-[60%] main-panel rounded-t-xl! rounded-b-none!">
        <app-footer />
    </footer>
</div>

<!--
    Игровой чат — плавающий виджет поверх контента: он не участвует
    в первом экране, поэтому его код и опрос Discord откладываются
    до простоя браузера.
-->
@defer (on idle) {
    <app-game-chat-widget
        [channelId]="environment.discordGameChatChannelId"
        [title]="'Игровой чат'"
        icon="@tui.message-square"
    />
}
