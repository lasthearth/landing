@if (config.garland) {
    <div class="festive-garland" aria-hidden="true">
        @for (link of links; track link) {
            <span class="festive-garland__link">
                <svg class="festive-garland__wire" viewBox="0 0 72 16" preserveAspectRatio="none" focusable="false">
                    <path d="M0,1 Q36,17 72,1" />
                </svg>
                <span class="festive-garland__bulb" [class]="'festive-garland__bulb--' + (link % 4)"></span>
            </span>
        }
    </div>
}

<!-- Снег не нужен первому экрану: холст и его цикл кадров ждут простоя браузера. -->
@if (config.snow) {
    @defer (on idle) {
        <canvas appSnowfall class="festive-snow" aria-hidden="true"></canvas>
    }
}
