<div class="bg-surface border-2 border-line/40 shadow-md rounded-2xl p-5 flex flex-col gap-4 lh-card-glow">
    <!-- Заголовок: ник игрока -->
    <div class="flex items-center gap-3 pb-3 border-b border-lh-primary-2/20">
        <app-image-loader
            src="/default-avatar.webp"
            class="size-14 shrink-0"
            objectFit="cover"
            [alt]="'admin.common.avatarAlt' | translate"
        />
        <div class="flex flex-col min-w-0">
            <span class="text-base text-ink-3 leading-5">{{ 'admin.playerForms.gameNameLabel' | translate }}</span>
            <span class="text-2xl font-bold text-ink truncate">{{ data().user_game_name }}</span>
        </div>
    </div>

    <!-- Вопросы и ответы -->
    <div class="flex flex-col divide-y divide-line">
        @for (item of data().answers; track $index) {
            <div class="flex flex-col gap-2 py-3 first:pt-0">
                <div class="flex items-start gap-2">
                    <tui-icon icon="@tui.message-circle-question" class="size-5! text-lh-accent shrink-0 mt-0.5" />
                    <span class="text-lg font-semibold text-ink leading-6">{{ item.question }}</span>
                </div>
                <div class="flex items-start gap-2 pl-7">
                    <span class="text-base text-ink-3 shrink-0 font-medium">{{ 'admin.playerForms.answerLabel' | translate }}</span>
                    <span class="text-lg text-ink-2 leading-6 break-words">{{ item.answer }}</span>
                </div>
            </div>
        }
    </div>

    <!-- Контакты -->
    <div class="flex items-center gap-3 pt-1">
        <tui-icon icon="@tui.phone" class="size-5! text-lh-accent shrink-0" />
        <div class="flex flex-col min-w-0">
            <span class="text-base text-ink-3 leading-4">{{ 'admin.playerForms.contactsLabel' | translate }}</span>
            <span class="text-lg font-semibold text-ink truncate">{{ data().contacts }}</span>
        </div>
    </div>

    <!-- Кнопки -->
    <div class="flex gap-3 justify-end pt-1">
        <button
            (click)="reject()"
            class="text-lg font-bold cursor-pointer bg-transparent border border-lh-danger text-lh-danger rounded-xl py-2 px-5 hover:bg-lh-danger/10 transition-colors"
        >
            {{ 'admin.playerForms.reject' | translate }}
        </button>
        <button
            (click)="approve()"
            class="text-lg font-bold cursor-pointer bg-lh-accent text-white rounded-xl py-2 px-5 hover:bg-brand-lit-2 transition-colors"
        >
            {{ 'admin.playerForms.approve' | translate }}
        </button>
    </div>
</div>
