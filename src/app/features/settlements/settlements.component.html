<div class="flex flex-col gap-6 p-6">
    <div class="flex flex-col gap-4">
        <h1 class="lh-display text-2xl md:text-3xl lg:text-4xl font-bold text-ink">{{ 'settlements.list.title' | translate }}</h1>

        <!--
            Сортировка набрана кнопками `.nav-button` — той же идиомой, что
            вкладки админки и навигация профиля. Активный ключ подсвечивается
            брендовым градиентом (`--active`), а не `!important`-перекрытием
            фона: перекрытие ломало тёмную тему и тени кнопки.
        -->
        <nav class="flex flex-wrap gap-2" [attr.aria-label]="'settlements.list.sort.label' | translate">
            <button
                type="button"
                class="nav-button shrink-0"
                [class.nav-button--active]="isSortActive('default')"
                [attr.aria-current]="isSortActive('default') ? 'true' : null"
                (click)="setSort('default')"
            >
                {{ 'settlements.list.sort.default' | translate }}
                <tui-icon icon="@tui.minus" />
            </button>
            <button
                type="button"
                class="nav-button shrink-0"
                [class.nav-button--active]="isSortActive('population')"
                [attr.aria-current]="isSortActive('population') ? 'true' : null"
                (click)="setSort('population')"
            >
                {{ 'settlements.list.sort.population' | translate }}
                <tui-icon
                    [icon]="isSortActive('population') ? '@tui.chevron-down' : '@tui.minus'"
                    class="transition-transform duration-300 origin-center"
                    [class.rotate-180]="getSortDirection('population') === 'asc'"
                />
            </button>
            <button
                type="button"
                class="nav-button shrink-0"
                [class.nav-button--active]="isSortActive('online')"
                [attr.aria-current]="isSortActive('online') ? 'true' : null"
                (click)="setSort('online')"
            >
                {{ 'settlements.list.sort.online' | translate }}
                <tui-icon
                    [icon]="isSortActive('online') ? '@tui.chevron-down' : '@tui.minus'"
                    class="transition-transform duration-300 origin-center"
                    [class.rotate-180]="getSortDirection('online') === 'asc'"
                />
            </button>
            <button
                type="button"
                class="nav-button shrink-0"
                [class.nav-button--active]="isSortActive('diplomacy')"
                [attr.aria-current]="isSortActive('diplomacy') ? 'true' : null"
                (click)="setSort('diplomacy')"
            >
                {{ 'settlements.list.sort.diplomacy' | translate }}
                <tui-icon
                    [icon]="isSortActive('diplomacy') ? '@tui.chevron-down' : '@tui.minus'"
                    class="transition-transform duration-300 origin-center"
                    [class.rotate-180]="getSortDirection('diplomacy') === 'asc'"
                />
            </button>
        </nav>
    </div>

    @if (loading()) {
        <div class="settlements-grid">
            @for (_ of skeletonItems; track $index) {
                <app-settlement-card-skeleton />
            }
        </div>
    } @else if (error()) {
        <app-error-state
            [title]="'settlements.list.error.title' | translate"
            [description]="'settlements.list.error.description' | translate"
            (retry)="retryLoad()"
        />
    } @else if (sortedSettlements().length === 0) {
        <app-empty-state
            icon="@tui.trees"
            [title]="'settlements.list.empty.title' | translate"
            [description]="'settlements.list.empty.description' | translate"
        />
    } @else {
        <div class="settlements-grid lh-stagger-list">
            @for (item of sortedSettlements(); track item.id) {
                <app-settlement-card
                    [data]="item"
                    [players]="item.players"
                    (tagsChanged)="loadSettlements()"
                />
            }
        </div>
    }
</div>
