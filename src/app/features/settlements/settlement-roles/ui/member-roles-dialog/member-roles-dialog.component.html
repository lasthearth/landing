<div class="lh-dialog-card min-w-[24rem]">
    <h2 class="lh-dialog-title">{{ 'settlements.roles.member.title' | translate:{name: memberName} }}</h2>

    @if (roles().length === 0) {
        <p class="lh-dialog-text">{{ 'settlements.roles.member.noRoles' | translate }}</p>
    } @else {
        <ul class="flex flex-col gap-2">
            @for (role of roles(); track role.id) {
                <li>
                    <button
                        type="button"
                        class="flex w-full items-center justify-between gap-3 rounded-xl px-3 py-2 text-left text-lg text-ink-2 transition-colors duration-200 hover:bg-surface-3 disabled:opacity-50"
                        [attr.aria-pressed]="hasRole(role)"
                        [disabled]="busy()"
                        (click)="toggle(role)"
                    >
                        <span>{{ role.name }}</span>
                        @if (hasRole(role)) {
                            <tui-icon icon="@tui.check" class="size-5! text-peace" />
                        } @else {
                            <tui-icon icon="@tui.plus" class="size-5! text-ink-3" />
                        }
                    </button>
                </li>
            }
        </ul>
    }

    <div class="lh-dialog-actions">
        <button type="button" class="lh-dialog-button lh-dialog-button-secondary" (click)="close()">
            {{ 'settlements.roles.member.close' | translate }}
        </button>
    </div>
</div>
