<!--
    Колонка пьедестала: игрок (аватар в кольце цвета медали, ник, результат) стоит
    на ступени с номером места. Ступени разной высоты — 1-я выше всех — поэтому
    тройка читается как пьедестал, а не как три пустые карточки.
-->
<article class="podium" [class]="'podium--' + medal()">
    <div class="podium__player">
        <div class="podium__ring">
            <app-player-avatar
                class="podium__avatar"
                [userId]="userId()"
                [src]="userImage() || '/default-avatar.webp'"
                [alt]="'profile.statistics.avatarAlt' | translate"
            />
        </div>
        <a class="podium__name" [routerLink]="['/player', playerName()]" [title]="playerName()">{{ playerName() }}</a>
        <p class="podium__result">
            <span class="podium__value">{{ count() | amount }}</span>
            <span class="podium__label">{{ type() }}</span>
        </p>
    </div>

    <div class="podium__step" aria-hidden="true">
        <span class="podium__place">{{ ratingPlace() }}</span>
    </div>
</article>
