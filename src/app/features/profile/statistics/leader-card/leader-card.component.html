<div class="main relative flex justify-center items-center" [class.main--big]="isBigSize()">
    <div
        class="ember-card flex px-3 sm:px-5 bg-[url('/br.webp')] bg-cover bg-center size-full flex-col gap-2 lg:gap-4 rounded-3xl justify-center items-center shadow-lg shadow-night-deep/60 border border-line-strong/30 card-tilt"
    >
        <app-player-avatar
            [userId]="userId()"
            [src]="userImage() || '/default-avatar.webp'"
            class="size-14 lg:size-20 z-30"
            [alt]="'profile.statistics.avatarAlt' | translate"
        />
        <p class="text-center nick-text text-shadow-2xl font-semibold z-30 text-parchment-3">
            <a class="hover:underline underline-offset-4" [routerLink]="['/player', playerName()]">{{ playerName() }}</a>
        </p>
        <p
            [class.gold-text]="ratingPlace() === '1'"
            [class.silver-text]="ratingPlace() === '2'"
            [class.bronze-text]="ratingPlace() === '3'"
            class="rating-text text-shadow-2xl font-extrabold z-30 rank-text"
        >
            {{ ratingPlace() }}
        </p>
        <div class="flex flex-col gap-1 justify-center items-center">
            <p class="count-text text-shadow-2xl text-shadow-2xl font-semibold z-30 text-parchment-3">
                {{ count() | amount }}
            </p>
            <p class="type-text opacity-50 lowercase text-shadow-2xl font-semibold z-30 text-parchment-3">
                {{ type() }}
            </p>
        </div>
    </div>
</div>
