<!--
    До 1280px на экране одна цель: пилюля у нижней кромки с текущим разделом.
    Весь список — в модалке снизу, сеткой в две колонки с подписями.
-->
<div class="pn-dock">
    <button
        type="button"
        class="pn-pill"
        (click)="toggleSheet()"
        [attr.aria-expanded]="sheetOpen()"
        aria-controls="profile-nav-sheet"
    >
        <tui-icon [icon]="active().icon" />
        <span class="pn-pill__label">{{ active().labelKey | translate }}</span>
        <tui-icon
            icon="@tui.chevron-up"
            class="pn-pill__chev"
            [class.pn-pill__chev--open]="sheetOpen()"
        />
    </button>
</div>

<!--
    Модалка снизу. Клика по scrim здесь нет намеренно: элемент с `inert`
    в момент гидратации не получает делегированный слушатель, поэтому
    закрытие живёт в обработчике документа (см. docs/TRAPS.md).
-->
<div
    id="profile-nav-sheet"
    class="pn-scrim"
    data-sheet-scrim
    [class.pn-scrim--open]="sheetOpen()"
    [attr.inert]="sheetOpen() ? null : ''"
>
    <div class="pn-sheet lh-panel" appSheetDrag (dismiss)="closeSheet()">
        <span class="pn-sheet__grip" data-sheet-handle aria-hidden="true"></span>
        <nav class="pn-grid">
            @for (item of items(); track item.route) {
                <a
                    class="nav-button pn-tile"
                    [routerLink]="item.route"
                    routerLinkActive="nav-button--active"
                    (click)="closeSheet()"
                >
                    <tui-icon [icon]="item.icon" />
                    <span class="pn-tile__label">{{ item.labelKey | translate }}</span>
                    @if (item.badge) {
                        <tui-pulse
                            tuiHintAppearance="floating"
                            class="!absolute !top-0.5 !right-0.5 !scale-110"
                        />
                    }
                </a>
            }
        </nav>
    </div>
</div>

<!-- От 1280px — прежняя вертикальная колонка знаков сбоку от колонки контента. -->
<nav class="pn-column">
    @for (item of items(); track item.route) {
        <a
            class="relative nav-button pn-column__item"
            [routerLink]="item.route"
            routerLinkActive="nav-button--active"
            [title]="item.labelKey | translate"
            [attr.aria-label]="item.labelKey | translate"
        >
            <tui-icon [icon]="item.icon" />
            @if (item.badge) {
                <tui-pulse tuiHintAppearance="floating" class="!absolute !top-0.5 !right-0.5 !scale-110" />
            }
        </a>
    }
</nav>
