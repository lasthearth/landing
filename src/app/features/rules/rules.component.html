<div #rulesRoot class="text-lh-primary lh-page-container flex flex-col gap-6 relative">
    <!-- Маркер для определения прокрутки -->
    <div id="rules-scroll-sentinel" class="absolute top-0 left-0 w-px h-px pointer-events-none"></div>

    <app-page-header [title]="'rules.title' | translate">
        <button type="button" (click)="toggleAll()" class="lh-chip lh-chip--lg">
            {{
                globalExpandService.globalExpandState()
                    ? ("rules.collapseAll" | translate)
                    : ("rules.expandAll" | translate)
            }}
        </button>
    </app-page-header>

    <app-rules-search [container]="rulesRoot" />

    <div class="rules-layout">
        <app-rules-toc class="rules-layout__toc" [items]="tocSections" (navigate)="goToSection($event)" />

        <div class="rules-layout__main">
            <!-- Терминология -->
            <div id="rules-terminology" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="terminology"
                    title="rules.sections.terminology"
                    icon="@tui.scroll-text"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-terminology (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>

            <!-- 1. Основы -->
            <div id="rules-base" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="base"
                    title="rules.sections.base"
                    appScrollAnchor="P1"
                    id="P1"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-base (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>

            <!-- 2. О владении наделом и организацией -->
            <div id="rules-settlements" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="settlements"
                    title="rules.sections.settlements"
                    appScrollAnchor="P2"
                    id="P2"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-about-settlements (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>

            <!-- 3. Действия игроков -->
            <div id="rules-actions" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="actions"
                    title="rules.sections.actions"
                    appScrollAnchor="P3"
                    id="P3"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-players-actions (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>

            <!-- 4. Вассалы -->
            <div id="rules-vassals" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="vassals"
                    title="rules.sections.vassals"
                    appScrollAnchor="P4"
                    id="P4"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-vassals (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>

            <!-- 5. Сословия -->
            <div id="rules-estates" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="estates"
                    title="rules.sections.estates"
                    appScrollAnchor="P5"
                    id="P5"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-estates (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>

            <!-- 6. Военные действия -->
            <div id="rules-military" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="military"
                    title="rules.sections.military"
                    appScrollAnchor="P6"
                    id="P6"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-military-actions (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>

            <!-- 7. Права и обязанности администрации -->
            <div id="rules-admin" class="lh-panel faq-scroll rules-layout__section">
                <app-rule-section
                    sectionId="admin"
                    title="rules.sections.admin"
                    appScrollAnchor="P7"
                    id="P7"
                    (scrollTo)="scrollToElement($event)"
                >
                    <app-admin-rights (scrollTo)="scrollToElement($event)" />
                </app-rule-section>
            </div>
        </div>
    </div>

    @if (showScrollTop) {
        <button
            type="button"
            (click)="scrollToTop()"
            class="lh-scroll-top"
            [title]="'rules.scrollTop' | translate"
            [attr.aria-label]="'rules.scrollTop' | translate"
        >
            <tui-icon icon="@tui.chevron-up" class="size-6!" />
        </button>
    }
</div>
