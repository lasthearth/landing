<div class="flex flex-col cursor-pointer" [attr.sectionid]="sectionId()" [class.mt-4]="needsMarginTop()">
    <!-- Кнопка, а не div с (click): раздел должен открываться и с клавиатуры -->
    <button
        type="button"
        class="flex w-full justify-between gap-3 cursor-pointer transition duration-300 hover:opacity-80 items-center text-left bg-transparent border-0 p-0"
        [attr.aria-expanded]="isExpanded()"
        (click)="toggle()"
    >
        <span class="flex items-center gap-2 flex-1">
            <span class="rule-section-title relative text-ink cursor-pointer font-bold" [class]="titleClass() + ' ' + indentClass()">
                @if (icon()) {
                    <tui-icon
                        [icon]="icon() ?? ''"
                        class="text-lh-primary size-6!"
                        [ngClass]="{ 'mr-2': level() > 0 }"
                    />
                }
                {{ title() | translate }}
                @if (!isWatched()) {
                    <!-- Статичная метка «ещё не открывали» (была пульсирующей точкой без пояснения) -->
                    <span
                        class="inline-block size-2 rounded-full bg-lh-accent align-middle ml-3"
                        role="img"
                        [attr.aria-label]="'shared.unread' | translate"
                        [title]="'shared.unread' | translate"
                    ></span>
                }
            </span>
        </span>
        <tui-icon
            icon="@tui.chevron-down"
            [ngClass]="{ 'rotate-180!': isExpanded() }"
            class="text-ink-2 transition size-6!"
        />
    </button>

    <tui-expand [expanded]="isExpanded()">
        <div [class]="contentClass()" class="mt-4">
            <ng-content />
        </div>
    </tui-expand>
</div>
