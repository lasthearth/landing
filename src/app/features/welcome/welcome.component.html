<div class="size-full relative" (tuiSwipe)="onSwipe($event)">
    <video
        #videoPlayer
        autoplay
        loop
        muted
        playsinline
        disablePictureInPicture
        controlslist="nodownload nofullscreen noremoteplayback"
        class="size-full object-cover blur-xs brightness-80"
        poster="/landing-carousel/1.webp"
        (click)="togglePlayback(videoPlayer)"
    >
        <source [src]="videoUrl" type="video/mp4" />
        {{ 'welcome.videoFallback' | translate }}
        <code>video</code>
    </video>

    <!-- Свет очага: мягкое свечение от нижней части экрана -->
    <div class="hearth-glow pointer-events-none" aria-hidden="true"></div>

    <!-- Двойная фаска: оправа и стеклянное ядро -->
    <div
        class="welcome-bezel absolute left-1/2 top-[40%] lg:top-[45%] -translate-x-1/2 -translate-y-1/2 w-[92%] max-w-5xl"
    >
        <div
            class="welcome-card backdrop-blur-md backdrop-brightness-85 flex flex-col justify-center items-center text-center text-white px-6 py-10 lg:px-12 lg:py-14"
        >
            <h1
                class="lh-display welcome-stagger text-4xl md:text-6xl xl:text-8xl 2xl:text-[120px] font-bold mb-3 uppercase !text-shadow-lg"
            >
                Last Hearth
            </h1>

            <p class="welcome-stagger text-lg md:text-2xl/7.5 lg:text-3xl font-semibold mt-2 !text-shadow-lg text-[#f0e6d2]">
                {{ 'welcome.subtitle' | translate }}
            </p>

            <p class="welcome-stagger text-base md:text-xl lg:text-2xl mt-4 max-w-3xl !text-shadow-md text-[#e8d8b8]">
                {{ 'welcome.description' | translate }}
            </p>

            <div
                class="welcome-stagger mt-8 lg:mt-12 w-full flex flex-col lg:flex-row gap-6 lg:gap-10 justify-center items-center lg:items-stretch px-0 lg:px-8"
            >
                <div class="welcome-feature">
                    <span class="welcome-feature__icon">
                        <tui-icon icon="@tui.flame" class="!text-2xl md:!text-3xl" />
                    </span>
                    <p class="text-base lg:text-lg !text-shadow-lg w-64 md:w-72 text-[#f0e6d2]">
                        {{ 'welcome.feature1' | translate }}
                    </p>
                </div>
                <div class="welcome-feature">
                    <span class="welcome-feature__icon">
                        <tui-icon icon="@tui.shield" class="!text-2xl md:!text-3xl" />
                    </span>
                    <p class="text-base lg:text-lg !text-shadow-lg text-wrap break-words w-64 md:w-72 text-[#f0e6d2]">
                        {{ 'welcome.feature2' | translate }}
                    </p>
                </div>
                <div class="welcome-feature">
                    <span class="welcome-feature__icon">
                        <tui-icon icon="@tui.users" class="!text-2xl md:!text-3xl" />
                    </span>
                    <p class="text-base lg:text-lg !text-shadow-lg w-64 md:w-72 text-[#f0e6d2]">
                        {{ 'welcome.feature3' | translate }}
                    </p>
                </div>
            </div>

            <div
                class="welcome-stagger mt-8 lg:mt-12 flex flex-col sm:flex-row gap-4 w-full sm:w-auto justify-center items-center"
            >
                <button type="button" (click)="scroll()" class="lh-cta text-lg md:text-xl uppercase tracking-wide">
                    {{ 'welcome.startPlaying' | translate }}
                    <span class="lh-cta__icon">
                        <tui-icon icon="@tui.arrow-right" class="size-4!" />
                    </span>
                </button>
                <a
                    href="https://discord.com/invite/FZb7SGrSFy"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="lh-cta welcome-cta-ghost text-lg md:text-xl uppercase tracking-wide no-underline!"
                >
                    {{ 'welcome.joinDiscord' | translate }}
                    <span class="lh-cta__icon">
                        <tui-icon icon="@tui.message-circle" class="size-4!" />
                    </span>
                </a>
            </div>
        </div>
    </div>

    <div
        class="absolute bottom-6 left-6 z-10 flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/35 backdrop-blur-sm text-white/70 text-sm pointer-events-none select-none"
    >
        <tui-icon icon="@tui.pause" class="size-4!" />
        {{ 'welcome.pauseHint' | translate }}
    </div>

    <button
        (click)="scroll()"
        class="welcome-scroll-hint w-12 h-20 md:w-14 md:h-24 rounded-2xl z-20 absolute top-[83%] left-1/2 flex items-center justify-center text-parchment-2"
        [attr.aria-label]="'welcome.scrollDownAriaLabel' | translate"
    >
        <tui-icon icon="@tui.chevrons-down" class="!text-3xl md:!text-5xl" />
    </button>
</div>
