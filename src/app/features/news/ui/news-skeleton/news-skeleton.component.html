<!--
    Скелетон повторяет геометрию карточки новости: та же двойная фаска,
    та же обложка и тот же состав записи. Полосы набраны от токена чернил,
    поэтому они читаются и на светлом пергаменте, и на тёмной теме.
-->
<div class="lh-panel lh-panel--bezel w-full">
    <div class="lh-panel__core flex overflow-clip" [class]="compact() ? 'flex-col' : 'flex-col lg:flex-row'">
        <div
            class="aspect-video w-full shrink-0 animate-pulse bg-ink/10"
            [class]="compact() ? '' : 'lg:aspect-auto lg:w-[42%] lg:min-w-72'"
        ></div>

        <div class="flex flex-1 flex-col gap-3 p-5 md:p-6" [class.lg:p-8]="!compact()">
            <div class="h-7 w-3/4 animate-pulse rounded-md bg-ink/10"></div>
            <div class="h-4 w-2/5 animate-pulse rounded-md bg-ink/10"></div>

            <div class="mt-1 flex flex-col gap-2">
                <div class="h-4 w-full animate-pulse rounded-md bg-ink/10"></div>
                <div class="h-4 w-5/6 animate-pulse rounded-md bg-ink/10"></div>
                <div class="h-4 w-4/6 animate-pulse rounded-md bg-ink/10"></div>
            </div>

            <div class="mt-auto flex items-center justify-between gap-3 pt-2">
                <div class="h-5 w-40 animate-pulse rounded-md bg-ink/10"></div>
                <div class="h-8 w-24 animate-pulse rounded-full bg-ink/10"></div>
            </div>
        </div>
    </div>
</div>
