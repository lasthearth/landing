<div class="lh-page-container flex flex-col gap-4 lg:gap-6">
    <app-breadcrumbs [items]="crumbs()" />

    <app-page-header
        [level]="1"
        [title]="'news.list.title' | translate"
        [subtitle]="'news.list.subtitle' | translate"
    />

    @if (news().length) {
        <!-- Заголовок ленты скрыт: на странице уже есть «Новости» в h1, а порядок заголовков ломать нельзя -->
        <section class="news-list" aria-labelledby="news-list-heading">
            <h2 id="news-list-heading" class="sr-only">{{ "news.list.feedHeading" | translate }}</h2>

            <div class="news-list__grid">
                @for (item of news(); track item.id) {
                    <app-news-card
                        variant="compact"
                        [id]="item.id"
                        [title]="item.title"
                        [content]="item.content"
                        [preview]="item.preview"
                        [date]="item.formattedDate"
                        [createdAt]="item.createdAt"
                        [viewCount]="item.viewCount"
                        [showReactions]="false"
                    />
                }
            </div>
        </section>
    } @else {
        <app-empty-state
            icon="@tui.newspaper"
            [title]="'news.list.empty' | translate"
            [description]="'news.list.emptyHint' | translate"
        />
    }
</div>
