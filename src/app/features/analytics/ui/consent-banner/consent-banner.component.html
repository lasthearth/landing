@if (visible()) {
    <aside class="consent-banner" role="region" aria-labelledby="consent-banner-title">
        <div class="consent-banner__head">
            <span class="consent-banner__seal" aria-hidden="true">
                <tui-icon icon="@tui.cookie" />
            </span>
            <p id="consent-banner-title" class="consent-banner__title">
                {{ "analytics.consent.title" | translate }}
            </p>
        </div>

        <p class="consent-banner__text">
            {{ "analytics.consent.text" | translate }}
            <a class="consent-banner__link" [routerLink]="['/privacy-policy']">
                {{ "analytics.consent.policy" | translate }}
            </a>
        </p>

        <div class="consent-banner__actions">
            <button type="button" class="lh-cta consent-banner__btn" (click)="allow()">
                {{ "analytics.consent.allow" | translate }}
            </button>
            <button type="button" class="lh-cta lh-cta--ghost consent-banner__btn" (click)="deny()">
                {{ "analytics.consent.deny" | translate }}
            </button>
        </div>
    </aside>
}
