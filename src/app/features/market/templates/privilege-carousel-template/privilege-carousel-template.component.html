<div class="flex gap-6 justify-center items-center">
    <button
        (click)="navigate(-1)"
        type="button"
        aria-label="Предыдущий набор"
        class="cursor-pointer text-white bg-lh-primary p-2 rounded-2xl hidden sm:block"
    >
        <tui-icon icon="@tui.chevron-left" />
    </button>
    <tui-carousel [itemsCount]="3" [(index)]="carouselIndex">
        @for (item of items(); track $index) {
            <button *tuiItem type="button" (click)="selectedPrivilege.emit(item)" class="cursor-pointer w-full text-left">
                <ng-container *ngTemplateOutlet="itemTemplate(); context: { $implicit: item }"></ng-container>
            </button>
        }
    </tui-carousel>
    <button
        (click)="navigate(1)"
        type="button"
        aria-label="Следующий набор"
        class="cursor-pointer text-white bg-lh-primary p-2 rounded-2xl hidden sm:block"
    >
        <tui-icon icon="@tui.chevron-right" />
    </button>
</div>
<tui-pagination size="s" [length]="items().length - 2" [(index)]="carouselIndex" class="mt-6" />
