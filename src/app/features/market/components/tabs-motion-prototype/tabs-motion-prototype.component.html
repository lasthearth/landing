<!--
    ПРОТОТИП, НЕ ПРОДАКШН. Четыре способа двигать переключатель вкладок.
    Вариант и направление лежат в data-атрибутах: вся разница между
    вариантами описана в LESS селекторами, разметка одна.
-->
<div class="proto-tabs" [attr.data-variant]="variant()" [attr.data-direction]="direction()">
    <div class="proto-tablist" role="tablist" aria-label="Группы товаров магазина">
        @if (variant() === 'A') {
            <span
                class="proto-pill"
                aria-hidden="true"
                [style.transform]="'translateX(' + pill().x + 'px)'"
                [style.width.px]="pill().w"
            ></span>
        }
        @for (tab of tabs; track tab; let index = $index) {
            <button
                #tabButton
                type="button"
                role="tab"
                class="proto-tab"
                [class.is-active]="active() === index"
                [attr.aria-selected]="active() === index"
                (click)="select(index)"
            >
                {{ tab | translate }}
            </button>
        }
    </div>

    <div class="proto-stage">
        @if (leaving() !== null; as gone) {
            <div class="proto-panel proto-panel--exit" (animationend)="onLeaveEnd()">
                <ng-container *ngTemplateOutlet="panel; context: { index: gone }" />
            </div>
        }
        <!-- @switch пересоздаёт панель на каждую смену вкладки, иначе
             входная анимация не проигралась бы повторно. -->
        @switch (active()) {
            @case (0) {
                <div class="proto-panel proto-panel--enter"><app-titles /></div>
            }
            @case (1) {
                <div class="proto-panel proto-panel--enter"><app-kits /></div>
            }
            @case (2) {
                <div class="proto-panel proto-panel--enter"><app-special /></div>
            }
        }
    </div>

    <app-prototype-switcher [variants]="variantKeys" [current]="variant()" [names]="variantNames" />
</div>

<ng-template #panel let-index="index">
    @switch (index) {
        @case (0) {
            <app-titles />
        }
        @case (1) {
            <app-kits />
        }
        @case (2) {
            <app-special />
        }
    }
</ng-template>
