<!--
    Атмосферная сцена 404: ночная пустошь и последний очаг.
    Тёмный фон одинаков в обеих темах (токены --lh-night-*), поверх него
    тлеющие угли и мерцающее пламя. Свет факела (`.not-found__torch`)
    следует за курсором через переменные --torch-x/--torch-y.
    aria-hidden на всём декоре: скринридеру важны только заголовок и ссылки.
-->
<section class="not-found" aria-labelledby="not-found-title">
    <!-- Слой свечения факела: идёт за курсором, «освещая» сцену. -->
    <div class="not-found__torch" aria-hidden="true"></div>

    <!-- Поднимающиеся угли. Число задаётся разметкой, разброс — в LESS по :nth-child. -->
    <div class="not-found__embers" aria-hidden="true">
        @for (ember of embers; track $index) {
            <span class="not-found__ember"></span>
        }
    </div>

    <div class="not-found__content">
        <!-- Очаг: пламя за огромной цифрой 404. -->
        <div class="not-found__hearth" aria-hidden="true">
            <span class="not-found__flame"></span>
        </div>

        <h1 id="not-found-title" class="lh-display not-found__code">404</h1>

        <p class="not-found__title lh-display">{{ 'notFound.title' | translate }}</p>

        <p class="not-found__description">{{ 'notFound.description' | translate }}</p>

        <div class="not-found__actions">
            <a [routerLink]="['/home']" class="lh-cta">
                <span class="lh-cta__icon"><tui-icon icon="@tui.flame" /></span>
                {{ 'notFound.home' | translate }}
            </a>

            <a [routerLink]="['/market']" class="lh-cta lh-cta--ghost">
                <span class="lh-cta__icon"><tui-icon icon="@tui.arrow-right" /></span>
                {{ 'notFound.market' | translate }}
            </a>
        </div>
    </div>
</section>
