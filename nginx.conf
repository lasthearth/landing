events {}
http {
  include /etc/nginx/mime.types;

  # Сборка отдаёт 2.2 MB JS. Без сжатия это уходило в сеть целиком;
  # с gzip тот же бандл весит ~380 kB.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

  sendfile on;
  tcp_nopush on;

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Прод-сборка хеширует все js/css (`outputHashing: all`), поэтому имя
    # файла меняется вместе с содержимым.
    location ~* \.(?:js|css)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Статика без хеша: кешируем, но с ревалидацией — файл может смениться
    # под тем же именем.
    location ~* \.(?:webp|png|jpe?g|svg|ico|mp4|woff2?)$ {
      expires 30d;
      add_header Cache-Control "public";
    }

    # HTML — точка входа (включая предрендеренные страницы), из него берутся
    # ссылки на хешированные файлы, поэтому кешировать нельзя: иначе после
    # деплоя клиент запросит удалённые чанки.
    location ~* \.html$ {
      add_header Cache-Control "no-cache";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
