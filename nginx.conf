# Рабочие процессы — от имени nginx: под ним же создаётся каталог кэша HTML
# (см. Dockerfile), иначе запись в кэш запрещена.
user nginx;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  # Сборка отдаёт 2.2 MB JS. Без сжатия это уходило в сеть целиком;
  # с gzip тот же бандл весит ~380 kB.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml;

  # Кэш гостевого HTML на 60 с: всплеск трафика (робот, репост в соцсети)
  # обслуживается из памяти, а не рендерится node заново. Ключ — полный адрес
  # с query; запросы с авторизацией и /profile идут мимо кэша.
  proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html:10m max_size=128m inactive=10m use_temp_path=off;

  # Node-сервер SSR. Имя сервиса из compose.yaml, наружу порт не публикуется:
  # снаружи виден только nginx.
  upstream ssr {
    server app:4000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # TLS заканчивается на внешнем прокси, поэтому Location должен быть
    # относительным: иначе nginx подставит свою схему и внутренний порт 8080.
    absolute_redirect off;
    port_in_redirect off;

    # Канонический адрес главной — корень домена. Query сохраняется: именно так
    # приходит OIDC-колбэк /home/?code=…&state=….
    rewrite ^/home/?$ / permanent;

    # Один вид адресов: без завершающего слэша (/rules/ → /rules).
    rewrite ^/(.+)/$ /$1 permanent;

    # Прямой запрос главной ведём на корень, прочие *.html — дубли адресов:
    # их отдаёт node по «чистому» пути, в выдаче им делать нечего.
    location = /index.html {
      return 301 /$is_args$args;
    }

    location ~* \.html$ {
      return 404;
    }

    # Прод-сборка хеширует все js/css (outputHashing: all), поэтому имя файла
    # меняется вместе с содержимым. Отдаём с диска, минуя node.
    location ~* \.(?:js|css)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Статика без хеша: кешируем, но с ревалидацией — файл может смениться
    # под тем же именем.
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|mp4|webm|woff2?)$ {
      expires 30d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # robots.txt, sitemap.xml, webmanifest: имя не меняется, а содержимое
    # обновляется при каждом деплое — час, а не месяц.
    location ~* \.(?:txt|xml|webmanifest|json)$ {
      expires 1h;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # Профиль — браузерный рендер и данные пользователя: кэш выключен всегда.
    location ^~ /profile {
      proxy_pass http://ssr;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache off;
      # 404 рисует приложение, подменять его своей страницей нельзя.
      proxy_intercept_errors off;
      add_header Cache-Control "no-store" always;
    }

    # Всё остальное — HTML: предрендеренные страницы, серверный рендер
    # (вики, новости, поселения, игроки) и 404 от приложения.
    location / {
      proxy_pass http://ssr;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      # Код ответа (в том числе 404) отдаёт приложение.
      proxy_intercept_errors off;

      # Гостевые ответы кэшируются по URL на минуту; запрос с авторизацией
      # (заголовок или кука) кэш не читает и не пишет. Блокировка не даёт
      # десятку одновременных запросов одного адреса запустить десять рендеров.
      proxy_cache html;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_valid 200 60s;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      proxy_cache_bypass $http_authorization $cookie_authorization $cookie_access_token $cookie_id_token $cookie_refresh_token $cookie_token;
      proxy_no_cache $http_authorization $cookie_authorization $cookie_access_token $cookie_id_token $cookie_refresh_token $cookie_token;
      add_header X-Cache-Status $upstream_cache_status always;
      # HTML ссылается на хешированные файлы, которые после деплоя исчезают:
      # у клиента он должен ревалидироваться, а не жить в кэше браузера.
      add_header Cache-Control "no-cache" always;
    }
  }
}
