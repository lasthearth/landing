        <!--
            Предотвращает промаргивание темы при перезагрузке.
            Выставляет data-theme до загрузки Angular: сохранённый выбор, иначе системная тема.
        -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('lh-theme');
                    if (theme) {
                        theme = JSON.parse(theme);
                    }
                    // Без сохранённого выбора тема следует системной настройке.
                    if (theme !== 'dark' && theme !== 'light') {
                        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    }
                    if (theme === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                } catch (e) {
                    // localStorage недоступен или значение повреждено — оставляем светлую тему
                }
            })();
        </script>

        <!--
            Есть ли сохранённая сессия входа (angular-auth-oidc-client хранит её в localStorage
            под ключом конфигурации, с полем authzData). Пререндер главной — гостевой,
            а признак входа приходит только после проверки токена и загрузки профиля:
            без этого флага вошедший игрок секунду видел гостевую карусель.
        -->
        <script>
            (function () {
                try {
                    for (var i = 0; i < localStorage.length; i++) {
                        var raw = localStorage.getItem(localStorage.key(i));
                        if (raw && raw.indexOf('authzData') !== -1) {
                            var data = JSON.parse(raw);
                            if (data && data.authzData) {
                                document.documentElement.classList.add('lh-has-session');
                                break;
                            }
                        }
                    }
                } catch (e) {
                    // localStorage недоступен — считаем гостем
                }
            })();
        </script>
